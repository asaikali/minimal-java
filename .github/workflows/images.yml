# =============================================================================
# Images — build the whole image series multi-arch on GitHub Actions.
# =============================================================================
#
# Demonstrates building linux/amd64 + linux/arm64 images in CI — the same series
# scripts/build-images.sh builds locally. GitHub's hosted runners are amd64-only,
# so the arm64 variant is built under QEMU emulation. That's faithful but slow:
# the jre-trim step and the jvm-aot/spring-aot AOT *training runs* all execute
# emulated. We accept the slowness here — the point is to show the multi-arch
# build working end to end.
#
# This is a build-only validation: it builds every target for BOTH arches to
# prove they compile, but does not push. (You can't `--load` a multi-arch
# manifest without the containerd image store, and we don't publish from CI.)
# It then builds just the native-arch `app` image, loads it, and smoke-tests
# that it actually serves a quote.
#
# Kept separate from build.yml (the fast `mvnw verify` gate) so ordinary PRs stay
# quick while this slower image build runs alongside it. Uses only first-party
# actions (actions/*, docker/*); no registry credentials are needed since nothing
# is pushed. No layer caching is configured — add `--cache-to/--cache-from
# type=gha` (or switch to docker/build-push-action) if you want faster reruns.
# =============================================================================

name: Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Register QEMU binfmt handlers so the amd64 runner can build linux/arm64
      # by emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # The docker-container buildx driver is the one that can build multiple
      # platforms in a single invocation.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build each target for BOTH arches. No --load/--push, so this validates
      # that the full series builds multi-arch without exporting anything. Within
      # one job the builder reuses cached layers, so the shared ubuntu/jre stages
      # are built once and the app/jvm-aot/spring-aot siblings reuse them.
      # Smallest first, matching scripts/build-images.sh.
      - name: Build the image series (linux/amd64 + linux/arm64)
        run: |
          for target in ubuntu jre app jvm-aot spring-aot fat; do
            echo "::group::minimal-java:${target} (linux/amd64,linux/arm64)"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --target "${target}" \
              .
            echo "::endgroup::"
          done

      # Smoke test: build just the native-arch app image, load it into the local
      # Docker store (single-arch --load works), run it, and confirm it serves a
      # quote. The layers are already cached from the multi-arch build above.
      - name: Smoke-test the app image
        run: |
          docker buildx build --platform linux/amd64 --target app --tag minimal-java:app --load .
          docker run -d --rm --name smoke -p 8080:8080 minimal-java:app
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/ >/dev/null 2>&1 && break
            sleep 2
          done
          response="$(curl -fsS http://localhost:8080/)"
          echo "response: ${response}"
          echo "${response}" | grep -q '"author"'
          docker rm -f smoke
