# =============================================================================
# Artifact — build the application jar ONCE and publish it to ghcr with ORAS.
# =============================================================================
#
# The "build the software" pipeline. It compiles the Spring Boot app (twice: the
# plain jar and the Spring-AOT jar via -Pspringaot) and pushes each as an OCI
# artifact to ghcr.io/<owner>/<repo>/jar with ORAS — NOT as a container image.
# The jar is architecture-independent, so it's built once here; the containerize
# pipelines then pull this exact artifact instead of recompiling per image/arch.
#
# Triggers only on changes to the application (src/**, pom.xml, the Maven wrapper)
# or this file. Publishes on push to main / dispatch; on a pull request it builds
# both jars but does not push (a fast compile + package check, complementing the
# unit-test gate in build.yml).
#
# The container images carry buildx --sbom/--provenance attestations; attaching a
# CycloneDX SBOM to the jar artifact too (via `oras attach`) is a natural next
# step — see README. Left out here to keep the pipeline lean.
# =============================================================================

name: Artifact

on:
  push:
    branches: [main]
    paths:
      - src/**
      - pom.xml
      - mvnw
      - mvnw.cmd
      - .mvn/**
      - scripts/publish-artifact.sh
      - .github/workflows/artifact.yml
  pull_request:
    paths:
      - src/**
      - pom.xml
      - mvnw
      - mvnw.cmd
      - .mvn/**
      - scripts/publish-artifact.sh
      - .github/workflows/artifact.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push the jar artifact to ghcr (GITHUB_TOKEN)

env:
  REGISTRY: ghcr.io

jobs:
  artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image namespace
        run: echo "IMAGE_BASE=${REGISTRY}/${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      # Java 25 to match <java.version> in pom.xml; cache ~/.m2 between runs.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ORAS pushes the jar to the registry as a first-class OCI artifact.
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On PR: build + stage both jars only (no push). On main/dispatch: build,
      # stage, and oras-push to ghcr.io/<owner>/<repo>/jar (plain + -springaot).
      - name: Build and publish the jar artifact
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./scripts/publish-artifact.sh --local
          else
            ./scripts/publish-artifact.sh "${IMAGE_BASE}"
          fi
