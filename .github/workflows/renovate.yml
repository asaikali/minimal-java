# =============================================================================
# Renovate (self-hosted, runs on GitHub Actions)
# =============================================================================
#
# Keeps this repo's dependencies current: the Maven deps in pom.xml (and the
# Spring Boot parent), the base images in the Dockerfile (ubuntu, eclipse-temurin)
# and the chisel release it downloads, the Maven wrapper, and the GitHub Actions
# used below. Configuration lives in ../../renovate.json; the full picture is in
# ../../docs/renovate.md.
#
# Why self-hosted instead of the Mend-hosted Renovate GitHub App:
# Running Renovate ourselves on GitHub-hosted Actions runners keeps everything
# inside GitHub's boundary and under our control — no third-party SaaS, and the
# whole pipeline stays visible in the repo.
#
# -----------------------------------------------------------------------------
# Auth: a GitHub App (NOT the built-in GITHUB_TOKEN, NOT a PAT)
# -----------------------------------------------------------------------------
# Renovate has to authenticate to the GitHub API to push branches, open PRs, and
# maintain the Dependency Dashboard issue. We use a GitHub App installation token
# rather than the built-in GITHUB_TOKEN. The deciding reason, learned the hard way:
#
#   GITHUB_TOKEN cannot open pull requests unless the repo enables
#   "Allow GitHub Actions to create and approve pull requests"
#   (Settings → Actions → General). With that left at its default (off), Renovate
#   runs "successfully" but silently opens nothing — every update just sits on the
#   Dependency Dashboard. An App installation token is a *different actor* and is
#   NOT subject to that toggle, so it opens PRs without weakening that setting.
#
# Two more reasons the App wins (matter as the repo grows):
#   - PRs opened by GITHUB_TOKEN do NOT trigger other workflows (GitHub's recursion
#     guard), so any CI you add (e.g. `./mvnw verify`) would never run on a Renovate
#     PR — defeating the point of an auto-verified upgrade. App-token PRs trigger CI
#     normally because the actor differs.
#   - GITHUB_TOKEN can't hold the `workflows` scope, so it can't update the actions
#     pinned in this file. The App (Workflows: write) can.
#
# Why an App rather than a PAT: a PAT is owned by an individual (it breaks when that
# person leaves or rotates it) and is a long-lived broad secret. An App is owned by
# the account/org, scoped per-install, and mints a short-lived (~1h) token at runtime
# — the repo only stores the App ID and private key.
#
# -----------------------------------------------------------------------------
# One-time setup (see docs/renovate.md → "Setup" for the full walkthrough)
# -----------------------------------------------------------------------------
# Until the App is installed and the two secrets below exist, this workflow runs on
# schedule but cannot open PRs.
#
#   1. Create a GitHub App (account- or org-owned) at
#        Settings → Developer settings → GitHub Apps → New GitHub App.
#      Required repository permissions:
#        Contents:       Read and write   (push branches and commits)
#        Pull requests:  Read and write   (open and update PRs)
#        Issues:         Read and write   (maintain the Dependency Dashboard issue)
#        Workflows:      Read and write   (so Renovate can update .github/workflows/)
#        Metadata:       Read             (granted automatically)
#      No webhook or callback URL is needed — Renovate polls.
#   2. Generate a private key for the App (Settings → "Generate a private key")
#      and download the PEM file.
#   3. Install the App on this repository
#      (App page → Install App → choose account → select this repo).
#   4. In this repo: Settings → Secrets and variables → Actions → New repository secret.
#        RENOVATE_APP_ID          = the App's numeric App ID (App settings page)
#        RENOVATE_APP_PRIVATE_KEY = the entire contents of the downloaded PEM,
#                                   including the BEGIN/END lines
#
# -----------------------------------------------------------------------------
# Local preview
# -----------------------------------------------------------------------------
# Run `./scripts/renovate.sh` to preview what this workflow would propose, without
# touching GitHub. Run `./scripts/run-renovate.sh` to dispatch this workflow on demand.
#
# =============================================================================

name: Renovate

on:
  schedule:
    # Daily at 01:00 UTC. Adjust to match your timezone or release cadence.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Mint a short-lived installation token from the GitHub App credentials.
      # This token is scoped to whichever repos the App is installed on and
      # expires after ~1 hour — the secrets in the repo are the App ID and
      # private key, not a long-lived token.
      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # Pre-flight: confirm the installation token can reach this repo.
      # If the App isn't installed (or isn't installed on this repo), the
      # token mint above succeeds but every API call returns 404. A single
      # repo read here surfaces that within a second instead of after a
      # ~10-minute Renovate scan. Per-permission checks are intentionally
      # skipped — those are configured on the App itself, and Renovate's
      # own logs name the missing permission clearly when it hits one.
      - name: Validate GitHub App token can access the repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO" --jq .full_name >/dev/null 2>&1; then
              echo "::error::App installation token cannot read $REPO. Make sure the GitHub App is installed on this repository — see the workflow header."
              exit 1
          fi
          echo "Read access to $REPO: OK"

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.14
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: renovate.json
        env:
          # Tell Renovate which repository to operate on. Without this it logs
          # "No repositories found" and exits without doing anything.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
